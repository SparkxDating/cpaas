apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cpaas-api-hpa
  namespace: cpaas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cpaas-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
