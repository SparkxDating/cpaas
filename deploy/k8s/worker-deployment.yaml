apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpaas-worker
  namespace: cpaas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cpaas-worker
  template:
    metadata:
      labels:
        app: cpaas-worker
    spec:
      containers:
        - name: worker
          image: cpaas/worker:1.0.0
          envFrom:
            - configMapRef:
                name: cpaas-config
            - secretRef:
                name: cpaas-secrets
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
