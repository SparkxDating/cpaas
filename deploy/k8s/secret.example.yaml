apiVersion: v1
kind: Secret
metadata:
  name: cpaas-secrets
  namespace: cpaas
type: Opaque
stringData:
  DATABASE_URL: postgresql://cpaas:cpaas_secret@postgres:5432/cpaas?schema=public
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars-long!!
  JWT_REFRESH_SECRET: change-me-refresh-secret-min-32-chars-long!
  API_KEY_PEPPER: change-me-api-key-pepper-min-32-chars!!
  OTP_PEPPER: change-me-otp-pepper-min-32-chars-long!!!!
  WEBHOOK_SIGNING_SECRET: change-me-webhook-signing-secret!!!!!!
  ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
