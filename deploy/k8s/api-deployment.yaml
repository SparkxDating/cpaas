apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpaas-api
  namespace: cpaas
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cpaas-api
  template:
    metadata:
      labels:
        app: cpaas-api
    spec:
      containers:
        - name: api
          image: cpaas/api:1.0.0
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: cpaas-config
            - secretRef:
                name: cpaas-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cpaas
spec:
  selector:
    app: cpaas-api
  ports:
    - port: 3001
      targetPort: 3001
