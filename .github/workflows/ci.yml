name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cpaas
          POSTGRES_PASSWORD: cpaas_secret
          POSTGRES_DB: cpaas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cpaas -d cpaas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cpaas:cpaas_secret@localhost:5432/cpaas?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-min-32-characters!!
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters!
      API_KEY_PEPPER: ci-api-key-pepper-min-32-characters!!!!
      OTP_PEPPER: ci-otp-pepper-min-32-characters-long!!!!
      WEBHOOK_SIGNING_SECRET: ci-webhook-signing-secret!!!!!!!!!!!!!
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run db:generate
      - run: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
      - run: npm run build -w @cpaas/common
      - run: npm run build -w @cpaas/logger
      - run: npm run build -w @cpaas/auth
      - run: npm run build -w @cpaas/events
      - run: npm run build -w @cpaas/database
      - run: npm run build -w @cpaas/api
      - run: npm run build -w @cpaas/worker
      - run: npm run build -w @cpaas/sdk
      - run: npm test -w @cpaas/api --if-present

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f apps/api/Dockerfile -t cpaas/api:ci .
      - run: docker build -f apps/worker/Dockerfile -t cpaas/worker:ci .
